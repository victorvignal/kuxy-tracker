appId: app.kuxy.desktop
productName: KUXY
directories:
  buildResources: build
  output: release/${version}
files:
  - 'out/**'
asarUnpack:
  - '**/*.node'
  - '**/*.dll'
win:
  executableName: KUXY
  artifactName: KUXY-Setup-${version}.${ext}
mac:
  category: public.app-category.productivity
  artifactName: KUXY-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Office
  artifactName: KUXY-${version}.${ext}
publish:
  provider: github
  owner: victorvignal
  repo: kuxy-tracker
  releaseType: release
